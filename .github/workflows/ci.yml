name: CI

on:
  push:
    branches: [main, master, testnet]
  pull_request:
    branches: [main, master, testnet]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Remove stale user-level npm cache-dir config
        run: npm config delete cache-dir --location=user || true

      - name: Record npm toolchain version
        run: npm --version

      - name: Assert exact Node runtime
        run: node -e "if (process.versions.node !== '24.15.0') throw new Error('Expected Node 24.15.0; received ' + process.versions.node)"

      - name: Dependency lock integrity
        run: node scripts/check-dependency-lock-integrity.mjs

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Static verification suite
        run: npm run verify:static

      - name: Database RLS coverage
        run: node scripts/check-database-rls-coverage.mjs

      - name: Security definer ACL
        run: node scripts/check-security-definer-acl.mjs

  build:
    name: Typecheck lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [static]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Remove stale user-level npm cache-dir config
        run: npm config delete cache-dir --location=user || true

      - name: Record npm toolchain version
        run: npm --version

      - name: Assert exact Node runtime
        run: node -e "if (process.versions.node !== '24.15.0') throw new Error('Expected Node 24.15.0; received ' + process.versions.node)"

      - name: Dependency lock integrity
        run: node scripts/check-dependency-lock-integrity.mjs

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production safety scan
        run: npm run test:safety

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prepare Next.js diagnostics artifact on failure
        if: failure()
        run: |
          mkdir -p .next/diagnostics
          printf 'Workflow: %s\nRun: %s\nAttempt: %s\nCommit: %s\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > .next/diagnostics/ci-failure-context.txt

      - name: Preserve Next.js build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: next-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .next/diagnostics/**
            .next/trace
            .next/server/**/*.js.nft.json
          if-no-files-found: error
          retention-days: 7
