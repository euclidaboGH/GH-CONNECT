name: CI

concurrency:
  group: gh-connect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, testnet, master]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Node runtime preflight
        run: npm run check:runtime
      - name: Repository integrity audit
        run: npm run audit:project-integrity
      - name: Dependency lock preflight
        run: node scripts/check-dependency-lock-integrity.mjs
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: JSX safety
        run: npm run check:jsx
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Safety
        run: npm run test:safety
      - name: Deployment network safety
        run: npm run test:deployment-network-safety
      - name: Migration release readiness
        run: npm run check:migration-release-readiness
      - name: Generated migration inventory consistency
        run: npm run check:migration-inventory
      - name: Phase 1 release readiness policy
        run: node scripts/test-phase1-release-readiness.mjs
      - name: Release hygiene
        run: npm run check:release-hygiene
      - name: All repository regression scripts
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in scripts/test-*.mjs; do
            echo "==> $test_file"
            node "$test_file"
            count=$((count + 1))
          done
          echo "Executed $count regression scripts."
          test "$count" -gt 0
      - name: Migration inventory (no remote changes)
        run: npm run ops:migration-check
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  e2e-preview:
    runs-on: ubuntu-24.04
    needs: static
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/testnet'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm run check:runtime
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: E2E against explicit base URL
        env:
          GHC_E2E_BASE_URL: ${{ secrets.GHC_E2E_BASE_URL }}
          GHC_E2E_COOKIE_A: ${{ secrets.GHC_E2E_COOKIE_A }}
        run: |
          if [ -z "$GHC_E2E_BASE_URL" ]; then
            if [ "$GITHUB_REF" = "refs/heads/testnet" ]; then
              echo "GHC_E2E_BASE_URL is required for the Testnet branch release gate"
              exit 1
            fi
            echo "GHC_E2E_BASE_URL not set — skipping optional pull-request browser E2E; this is not release evidence"
            exit 0
          fi
          npx playwright test --project=chromium --project=mobile-chrome
      - name: Upload responsive screenshots, traces, and Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh-connect-preview-visual-qa-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Operator HTTP smoke
        env:
          GHC_E2E_BASE_URL: ${{ secrets.GHC_E2E_BASE_URL }}
        run: |
          if [ -z "$GHC_E2E_BASE_URL" ]; then
            if [ "$GITHUB_REF" = "refs/heads/testnet" ]; then
              echo "GHC_E2E_BASE_URL is required for the Testnet operator smoke gate"
              exit 1
            fi
            echo "Operator HTTP smoke skipped for this pull request; this is not release evidence"
            exit 0
          fi
          npm run operator:live-e2e

  e2e-production-smoke:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Node runtime preflight
        run: npm run check:runtime
      - name: Dependency lock preflight
        run: node scripts/check-dependency-lock-integrity.mjs
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium --with-deps
      - name: Production smoke
        env:
          GHC_E2E_BASE_URL: ${{ secrets.GHC_E2E_PRODUCTION_URL }}
          GHC_E2E_ALLOW_PRODUCTION: "1"
          GHC_E2E_TARGET: production
        run: |
          if [ -z "$GHC_E2E_BASE_URL" ]; then
            echo "GHC_E2E_PRODUCTION_URL secret required"
            exit 1
          fi
          npx playwright test --project=chromium
          npm run operator:live-e2e
      - name: Upload production smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh-connect-production-smoke-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
