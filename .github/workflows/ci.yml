name: CI

on:
  push:
    branches: [main, master, testnet]
  pull_request:
    branches: [main, master, testnet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Assert exact Node 24.15.0 runtime
        run: node -e "if (process.versions.node !== '24.15.0') { console.error('Expected 24.15.0 got', process.versions.node); process.exit(1) }"

      - name: Record npm toolchain version
        run: npm --version

      - name: Remove stale user npm cache-dir config
        run: npm config delete cache-dir --location=user

      - name: Dependency lock integrity
        run: node scripts/check-dependency-lock-integrity.mjs

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Static verification suite
        run: npm run verify:static

      - name: Critical request and payment contracts
        run: |
          npm run test:bounded-json-runtime
          node scripts/check-phase1-12-request-boundary-followup.mjs
          node scripts/check-phase10-marketplace-integrity.mjs
          node scripts/check-phase11-wallet-cross-feature-reconciliation.mjs
          node scripts/check-phase7-treasury-completion.mjs
          npm run check:phase15-payment-recovery
          npm run check:phase16-payment-timeline
          npm run check:phase18-marketplace-payment-binding
          npm run check:phase19-marketplace-rpc-transport

      - name: Duplicate JSX prop safety
        run: node scripts/check-jsx-duplicate-props.mjs

      - name: Database RLS coverage
        run: node scripts/check-database-rls-coverage.mjs

      - name: Security definer ACL
        run: node scripts/check-security-definer-acl.mjs

  build:
    name: Typecheck lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: static
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Assert exact Node 24.15.0 runtime
        run: node -e "if (process.versions.node !== '24.15.0') { console.error('Expected 24.15.0 got', process.versions.node); process.exit(1) }"

      - name: Record npm toolchain version
        run: npm --version

      - name: Remove stale user npm cache-dir config
        run: npm config delete cache-dir --location=user

      - name: Dependency lock integrity
        run: node scripts/check-dependency-lock-integrity.mjs

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production safety scan
        run: npm run test:safety

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Preserve Next.js build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: next-build-trace
          path: |
            .next/trace
            .next/diagnostics
          if-no-files-found: ignore
          retention-days: 7
