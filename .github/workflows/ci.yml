name: GH-CONNECT CI

on:
  push:
    branches: [main, testnet]
  pull_request:
    branches: [main, testnet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-connect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static checks, typecheck and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pinned Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify dependency lock and Pi SDK
        run: |
          node scripts/check-dependency-lock-integrity.mjs
          node scripts/verify-pi-backend-lock.mjs

      - name: Verify source safety and release metadata
        run: |
          node scripts/check-jsx-safety.mjs
          node scripts/scan-production-safety.mjs
          node scripts/check-project-truth.mjs
          node scripts/check-release-hygiene.mjs
          node scripts/check-clean-migrations.mjs
          node scripts/check-database-contract-source.mjs
          node scripts/generate-migration-inventory.mjs --check
          node scripts/check-migration-release-readiness.mjs
          node scripts/verify-phase14-static.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
