name: Repair npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-connect-lock-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Confirm official Pi SDK registry metadata is reachable
        run: npm view pi-backend@0.1.3 version dist.tarball dist.integrity --json
      - name: Regenerate package-lock.json from npm registry metadata
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - name: Verify complete Pi SDK lock entry
        run: node scripts/verify-pi-backend-lock.mjs
      - name: Verify all direct lock entries
        run: node scripts/check-dependency-lock-integrity.mjs
      - name: Clean install from regenerated lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Confirm installed SDK version
        run: npm ls pi-backend --depth=0
      - name: Run complete project verification and production build
        run: npm run ci:verify
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Create a pull request containing only the reviewed lockfile
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/repair-pi-backend-lock-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: package-lock.json
          commit-message: "fix: regenerate official Pi backend dependency lock"
          title: "fix: regenerate official Pi backend dependency lock"
          body: |
            ## Dependency lock recovery

            This pull request contains only the npm-generated `package-lock.json` update.

            Before opening this PR, the workflow:
            - queried official npm metadata for `pi-backend@0.1.3`;
            - regenerated the lockfile with Node.js 24.15.0 and `--legacy-peer-deps`;
            - verified the Pi SDK's official tarball, integrity metadata, `axios`, and `stellar-sdk` lock entries;
            - completed `npm ci --legacy-peer-deps`;
            - confirmed the installed Pi SDK version;
            - ran `npm run ci:verify`, including typecheck, lint, regression tests, and production build.

            Review the lockfile diff and CI results before merging. No deployment, database migration, or payment execution is performed by this workflow.
          draft: false
